</style><style>
:root{--bg:#f3f4f9;--c:#fff;--t:#1b1830;--m:#6f6c85;--l:#e7e7f1;--a:#5b4bff;--a2:#ecebff;--g:#12a574;--r:#f0455a;--y:#ffc93c;--sb:#14112b;--sh:0 1px 2px #1b18300a,0 10px 26px -14px #1b183040;--ease:cubic-bezier(.2,.8,.2,1)}

.p{background:var(--a);color:#fff;box-shadow:0 8px 16px -8px var(--a)}.p:hover{filter:brightness(1.1)}

.bars{height:190px;gap:6px}.bc{border-radius:8px;transition:background .15s}.bc:hover{background:var(--a2)}

.hb{border-radius:8px;padding:2px 4px;margin:4px -4px;transition:background .15s}.hb:hover{background:var(--a2)}.hb div{background:var(--l)}.hb i{background:linear-gradient(90deg,#9a8fff,var(--a));transform-origin:left}

.modal{background:#0c0a1d99;animation:fade .18s both}.modal.out{opacity:0;transition:opacity .16s}
.box{background:var(--c);color:var(--t);width:400px;max-width:92vw;border-radius:20px;box-shadow:0 30px 80px -20px #000a;animation:pop .28s var(--ease) both}.modal.out .box{transform:scale(.96);transition:transform .16s}
.box label{display:block;font-size:12px;color:var(--m);margin:10px 0 0}.box label input{display:block;width:100%;margin-top:4px}.err{color:var(--r);min-height:18px;margin:8px 0 0;font-size:12px}

#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{background:var(--y);color:#1b1830;border:0;padding:4px 12px;font-weight:700;border-radius:8px}
tr.out,.sk.out{opacity:0;transform:translateX(24px);transition:opacity .2s,transform .2s}.sk.out{transform:scale(.92)}
.flash>td{animation:fl 1.4s}.sk.flash{animation:fl2 1.4s}
/* motion: plays on page change only (body.enter), transform/opacity only */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes grx{from{transform:scaleX(0)}}
@keyframes drw{from{stroke-dashoffset:1}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes fl{from{background:#ffc93c77}}@keyframes fl2{from{box-shadow:0 0 0 4px var(--y)}}
body.enter main>*{animation:rise .55s var(--ease) both}
body.enter main>:nth-child(2){animation-delay:.05s}body.enter main>:nth-child(3){animation-delay:.1s}body.enter main>:nth-child(4){animation-delay:.15s}body.enter main>:nth-child(n+5){animation-delay:.2s}
body.enter .bc i{animation:grow .7s var(--ease) both;animation-delay:calc(var(--i)*30ms)}
body.enter .hb i,body.enter .lv i{animation:grx .8s var(--ease) both .25s;transform-origin:left}
body.enter .ln2{stroke-dasharray:1;animation:drw 1.1s var(--ease) both .2s}body.enter .af{animation:fade .8s .6s both}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.ln{border-bottom:2px dashed var(--l)}

const TR={on:false,mode:"tour",steps:[],i:0,cur:"",from:"dash"};
const trEl=k=>k==="tools"?$(".sb .me"):k==="intro"?($(".sb .brand")||$(".sb h2")):k==="done"?null:$('#nv a[data-pg="'+k+'"]');
function trMount(){if($("#tr"))return;const d=document.createElement("div");d.id="tr";d.className="tr";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");d.setAttribute("aria-label","Bun Bun tutorial");d.innerHTML='<div class="tr-spot none"></div>';document.body.appendChild(d)}
function trRender(){const o=$("#tr");if(!o)return;const old=$("#trc");if(old)old.remove();

li=b.map((x,j)=>`<li>${T.ol?`<i>${j+1}</i>`:""}<span><b>${x[0]}</b> ${x[1]}</span></li>`).join(""),
demo=last&&own&&!S.orders.length?`<button onclick="trDemo()">Try sample data</button>`:"",
ft=help?`<button class="lnk" onclick="trReplay()">Replay full tour</button><span class="sp"></span><button class="p" onclick="trClose()">Got it</button>`
:`${last?"":`<button class="lnk" onclick="trSkip()">Skip tour</button>`}<span class="sp"></span>${i>0?`<button onclick="trBack()">Back</button>`:""}${demo}<button class="p" onclick="trNext()">${last?"Let's go!":i===0?"Show me around":"Next"}</button>`;
const c=document.createElement("div");c.id="trc";c.className="tr-card"+(mid?" mid":"");
c.innerHTML=`<img class="tr-mas" src="assets/bun-bite.gif" alt=""><div class="tr-in"><div class="tr-hd"><span class="tr-ico">${T.ico}</span><h3>${T.t}</h3>${help?"":`<span class="tr-n">${i+1} / ${n}</span>`}</div>${help?"":`<div class="tr-bar"><i style="width:${(i+1)/n*100}%"></i></div>`}${w?`<p class="tr-w">${w}</p>`:""}<ul class="tr-l${T.ol?" ol":""}">${li}</ul>${T.tip?`<div class="tr-tip">💡 ${T.tip}</div>`:""}</div><div class="tr-ft">${ft}</div>`;

function trPos(){const s=$("#tr .tr-spot");if(!s)return;const el=trEl(TR.cur),r=el&&el.getBoundingClientRect();

else{Object.assign(s.style,{left:innerWidth/2+"px",top:innerHeight/2+"px",width:"0px",height:"0px"});s.classList.add("none")}}
function trGo(i){TR.i=Math.max(0,Math.min(TR.steps.length-1,i));const k=TR.steps[TR.i];TR.cur=k;
const want=["intro","tools","done"].includes(k)?TR.from:k;if(pg!==want){pg=want;draw()}
trRender();requestAnimationFrame(()=>{const el=trEl(k);if(el&&k!=="intro"&&k!=="tools")el.scrollIntoView({block:"nearest"});trPos()})}
function trStart(){if(!U||TR.on)return;const ids=[...document.querySelectorAll("#nv a[data-pg]")].map(a=>a.dataset.pg);if(!ids.length)return;
TR.on=true;TR.mode="tour";TR.steps=["intro",...ids,"tools","done"];TR.from=pg;trMount();trGo(0)}
function trHelp(){if(!U||TR.on)return;TR.on=true;TR.mode="help";TR.steps=[pg];TR.i=0;TR.cur=pg;trMount();trRender();trPos()}
function trClose(){const o=$("#tr");if(o)o.remove();TR.on=false}
function trFinish(to){if(TR.mode==="tour"&&U){try{localStorage.setItem("bb_tour_"+U.role,"1")}catch(e){}}
trClose();const ok=to&&document.querySelector('#nv a[data-pg="'+to+'"]')?to:TR.from;pg=ok;draw();const nv=$("#nv");if(nv)nv.scrollTop=0}
function trNext(){if(TR.mode==="help")return trClose();TR.i>=TR.steps.length-1?trFinish():trGo(TR.i+1)}
