</style><style>
:root{--bg:#f3f4f9;--c:#fff;--t:#1b1830;--m:#6f6c85;--l:#e7e7f1;--a:#5b4bff;--a2:#ecebff;--g:#12a574;--r:#f0455a;--y:#ffc93c;--sb:#14112b;--sh:0 1px 2px #1b18300a,0 10px 26px -14px #1b183040;--ease:cubic-bezier(.2,.8,.2,1)}

.p{background:var(--a);color:#fff;box-shadow:0 8px 16px -8px var(--a)}.p:hover{filter:brightness(1.1)}

.bars{height:190px;gap:6px}.bc{border-radius:8px;transition:background .15s}.bc:hover{background:var(--a2)}

.hb{border-radius:8px;padding:2px 4px;margin:4px -4px;transition:background .15s}.hb:hover{background:var(--a2)}.hb div{background:var(--l)}.hb i{background:linear-gradient(90deg,#9a8fff,var(--a));transform-origin:left}

.modal{background:#0c0a1d99;animation:fade .18s both}.modal.out{opacity:0;transition:opacity .16s}
.box{background:var(--c);color:var(--t);width:400px;max-width:92vw;border-radius:20px;box-shadow:0 30px 80px -20px #000a;animation:pop .28s var(--ease) both}.modal.out .box{transform:scale(.96);transition:transform .16s}
.box label{display:block;font-size:12px;color:var(--m);margin:10px 0 0}.box label input{display:block;width:100%;margin-top:4px}.err{color:var(--r);min-height:18px;margin:8px 0 0;font-size:12px}

#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{background:var(--y);color:#1b1830;border:0;padding:4px 12px;font-weight:700;border-radius:8px}
tr.out,.sk.out{opacity:0;transform:translateX(24px);transition:opacity .2s,transform .2s}.sk.out{transform:scale(.92)}
.flash>td{animation:fl 1.4s}.sk.flash{animation:fl2 1.4s}
/* motion: plays on page change only (body.enter), transform/opacity only */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes grx{from{transform:scaleX(0)}}
@keyframes drw{from{stroke-dashoffset:1}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes fl{from{background:#ffc93c77}}@keyframes fl2{from{box-shadow:0 0 0 4px var(--y)}}
body.enter main>*{animation:rise .55s var(--ease) both}
body.enter main>:nth-child(2){animation-delay:.05s}body.enter main>:nth-child(3){animation-delay:.1s}body.enter main>:nth-child(4){animation-delay:.15s}body.enter main>:nth-child(n+5){animation-delay:.2s}
body.enter .bc i{animation:grow .7s var(--ease) both;animation-delay:calc(var(--i)*30ms)}
body.enter .hb i,body.enter .lv i{animation:grx .8s var(--ease) both .25s;transform-origin:left}
body.enter .ln2{stroke-dasharray:1;animation:drw 1.1s var(--ease) both .2s}body.enter .af{animation:fade .8s .6s both}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.g4>.card.k:nth-child(4n+3){background:var(--k3)}.g4>.card.k:nth-child(4n+4){background:var(--k4)}
.k small{font-weight:600;letter-spacing:.02em}

th{color:var(--m);border-bottom:2px solid var(--ol);font-weight:700;letter-spacing:.04em}

.tag{border:2px solid var(--ol);font-weight:700;color:var(--ol)}

/* charts */
.bars{height:200px}
.bc i{background:linear-gradient(180deg,#ffd84a,var(--a));border:2px solid var(--ol);border-bottom:0;border-radius:8px 8px 0 0;min-height:0}
.bc:hover{background:var(--hv)}
.hb div{height:16px;border:2px solid var(--ol);background:var(--c);overflow:hidden}
.hb i{background:linear-gradient(90deg,#ffd84a,var(--a));border-radius:0 99px 99px 0;border-right:2px solid var(--ol)}
.hb:hover{background:var(--hv)}
.ln2{stroke:var(--a);stroke-width:3.5}
.dot{background:var(--y);border:3px solid var(--ol)}.cx{background:var(--ol)}
.lv{height:14px;border:2px solid var(--ol);background:var(--c)}
.lv i{border-radius:99px;border-right:2px solid var(--ol)}
.lv u{background:var(--ol);opacity:.8}
.goal .lv i{background:linear-gradient(90deg,var(--y),var(--g))}
.sk{border:2.5px solid var(--ol);box-shadow:var(--sh)}
.sk:hover{transform:translate(-2px,-2px);border-color:var(--ol);box-shadow:6px 6px 0 var(--ol)}
.sk.lo{border-color:var(--r);background:linear-gradient(180deg,var(--c),#ffe1dc22)}
.bn{background:#ffd84a55;border:2.5px solid var(--ol);box-shadow:3px 3px 0 var(--ol)}

/* pos + kitchen */
.it{border:2px solid var(--ol);border-radius:14px;box-shadow:2px 2px 0 var(--ol);font-weight:500}
.it:hover{background:var(--hv);border-color:var(--ol);transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ol)}
.it:active{transform:translate(2px,2px);box-shadow:none}
.it b{color:var(--a);font-family:var(--fd);font-size:15px}
.ln{border-bottom:2px dashed var(--l)}
.tot{font-size:24px;font-weight:700}
.kc{border:2.5px solid var(--ol);border-left-width:9px;border-radius:16px}

.tk.r span{background:var(--g);color:#fff;text-shadow:0 1px 0 #0004}

/* modal, toast, tooltip */
.modal{background:#1a0806b8}
.box{border:3px solid var(--ol);border-radius:22px;box-shadow:8px 8px 0 var(--ol);background:var(--c);color:var(--t)}

.hint.tiny{font-size:12px;margin-top:6px}

}

function calc(){const sub=sum(cart,i=>i.p*i.q),d=Math.min(sub,f.dt=="%"?sub*f.disc/100:f.disc||0),b=sub-d,sv=b*S.cfg.svc/100,tx=b*S.cfg.tax/100;return{sub,d,sv,tx,total:b+sv+tx}}
function items(){const e=$("#items");if(!e)return;e.innerHTML=S.menu.filter(m=>m.on&&(cat=="All"||m.cat==cat)&&m.name.toLowerCase().includes(q.toLowerCase())).map(m=>`<div class="it" onclick="add('${m.id}')"><span>${esc(m.name)}</span><b>${m.price}</b></div>`).join("")||'<p class="hint">No items found.</p>'}
function add(id){const m=S.menu.find(x=>x.id==id),i=cart.find(x=>x.id==id);i?i.q++:cart.push({id,n:m.name,p:m.price,q:1,c:m.cat});draw()}
const cq=(id,d)=>{const i=cart.find(x=>x.id==id);i.q+=d;if(i.q<1)cart=cart.filter(x=>x!=i);draw()};
function place(){if(!cart.length)return toast("Add items first");const c=calc(),o={id:uid(),no:S.seq++,t:Date.now(),items:cart,sub:c.sub,disc:c.d,svc:c.sv,tax:c.tx,total:c.total,cust:f.cust,type:f.type,pay:f.pay,status:"Pending",by:U.name},L=stk(o,-1);S.orders.push(o);cart=[];f.cust="";f.disc=0;save();draw();toast(L.length?"Order placed. Low stock: "+L.join(", "):"Order placed ✅")}
const ns=id=>{const o=S.orders.find(x=>x.id==id);o.status=NEXT[o.status];save();draw()};
function cn(id){if(!confirm("Cancel this order? Stock will be restored."))return;const o=S.orders.find(x=>x.id==id);stk(o,1);o.status="Cancelled";save();draw()}
function refund(id){const o=S.orders.find(x=>x.id==id),max=o.total-(o.ref||0),v=+prompt("Refund amount (Rs.). Full refund restores stock.",Math.round(max));if(!v||v<=0||v>max+.5)return toast("Invalid amount");o.ref=(o.ref||0)+v;if(o.ref>=o.total-.5){o.status="Refunded";stk(o,1)}save();draw();toast("Refunded "+rs(v))}
function prt(id){const o=S.orders.find(x=>x.id==id),w=window.open("","_blank");if(!w)return toast("Allow pop-ups to print");w.document.write(`<pre style="font:14px monospace;width:300px">${esc(S.cfg.name)}\nBill #${o.no}  ${new Date(o.t).toLocaleString()}\n${"-".repeat(30)}\n${o.items.map(i=>esc(i.q+" x "+i.n)+"  "+i.p*i.q).join("\n")}\n${"-".repeat(30)}\nSubtotal ${Math.round(o.sub)}\n${o.disc?"Discount -"+Math.round(o.disc)+"\n":""}Service ${Math.round(o.svc)}  Tax ${Math.round(o.tax)}\nTOTAL Rs. ${Math.round(o.total)}\n${o.ref?"Refunded Rs. "+Math.round(o.ref)+"\n":""}${o.pay}  (${esc(o.by||"")})</pre>`);w.print()}
function addMenu(){const n=$("#mn").value.trim(),c=$("#mc").value.trim(),p=+$("#mp").value;if(!n||!c||!p)return toast("Fill name, category and price");const m={id:uid(),cat:c,name:n,price:p,on:1};m.rc=dr(m,S.stock);S.menu.push(m);NEW=m.id;save();draw();toast("Item added")}

const sk=(id,k,v)=>{S.stock.find(s=>s.id==id)[k]=+v;save();draw()},sa=(id,d)=>{const s=S.stock.find(x=>x.id==id);s.qty=Math.max(0,s.qty+d);save();draw()},sd=id=>{if(confirm("Remove?")){S.stock=S.stock.filter(s=>s.id!=id);save();draw()}};

/* tooltips (one shared element, event delegation = no lag) */
function tipAt(h,e){TIP.innerHTML=h;TIP.classList.add("on");const w=TIP.offsetWidth,x=Math.max(8,Math.min(e.clientX+14,innerWidth-w-8)),y=e.clientY-TIP.offsetHeight-14;TIP.style.transform=`translate3d(${x}px,${y<8?e.clientY+18:y}px,0)`}
addEventListener("mousemove",e=>{const a=e.target.closest(".ac"),t=a||e.target.closest("[data-tip]");if(HV&&HV!==a){HV.classList.remove("hv");HV=null}
if(a){const r=a.getBoundingClientRect(),d=AC[a.dataset.c];if(!d)return;const n=d.v.length,i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1))));a.style.setProperty("--x",i/(n-1)*100+"%");a.style.setProperty("--y",d.y[i]+"%");a.classList.add("hv");HV=a;tipAt(d.t[i],e)}
else if(t)tipAt(t.dataset.tip,e);else TIP.classList.remove("on")});
document.addEventListener("mouseleave",()=>{TIP.classList.remove("on");if(HV){HV.classList.remove("hv");HV=null}});
